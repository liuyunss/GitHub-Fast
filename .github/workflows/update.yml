name: GitHubFast Update

on:
  schedule:
    # 每天 UTC 07:00 / 15:00 / 23:00 = 北京时间 15:00 / 23:00 / 07:00
    - cron: '0 7 * * *'
    - cron: '0 15 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hosts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update
        run: python -m src.main --repo ${{ github.repository }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hosts README.md
          git diff --staged --quiet || git commit -m "chore: update hosts $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
